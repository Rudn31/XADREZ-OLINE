plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rudn31.xadrezonline'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rudn31.xadrezonline'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }

    signingConfigs {
        release {
            // your private key (GitHub secret) when available; otherwise the public test key in keystore/
            def privateKey = System.getenv('KEYSTORE_FILE')
            storeFile privateKey ? file(privateKey) : file('../keystore/teste.jks')
            storePassword privateKey ? System.getenv('KEYSTORE_PASSWORD') : 'xadrez-teste'
            keyAlias 'xadrez'
            keyPassword privateKey ? System.getenv('KEYSTORE_PASSWORD') : 'xadrez-teste'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
