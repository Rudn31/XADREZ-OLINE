name: Gerar APK

# Builds the Android app (game bundled inside, bots work offline) on every update
# and publishes the APK on the repository's Releases page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Usar a chave privada (se cadastrada nos Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Assinando com a chave privada."
          else
            echo "Secret KEYSTORE_BASE64 não encontrado: assinando com a chave de teste."
          fi

      - name: Compilar
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk XadrezOnline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XadrezOnline-apk
          path: XadrezOnline.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Xadrez Online — APK ${{ github.run_number }}
          make_latest: true
          files: XadrezOnline.apk
          body: |
            Baixe o **XadrezOnline.apk** abaixo e abra no celular Android.
            - Contra os bots: funciona **sem internet**.
            - Online (partida rápida, salas e duplas): precisa de internet e usa o servidor https://xadrez-oline.onrender.com
